services:
  wg-easy:
    image: ghcr.io/wg-easy/wg-easy:15
    container_name: wg-easy
    networks:
      wg:
        ipv4_address: 10.50.50.42
        ipv6_address: fd50:1234:abcd::42
    volumes:
      - /home/mint/Templates/wg-easy/config:/etc/wireguard
      - /lib/modules:/lib/modules:ro
    ports:
      - "51820:51820/udp"          # WireGuard tunnel
      - "127.0.0.1:51821:51821/tcp" # Web UI, only exposed locally for NGINX
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv6.conf.all.forwarding=1
      - net.ipv6.conf.default.forwarding=1

networks:
  wg:
    driver: bridge
    enable_ipv6: true
    ipam:
      driver: default
      config:
        - subnet: 10.50.50.0/24
          gateway: 10.50.50.1
        - subnet: fd50:1234:abcd::/64
          gateway: fd50:1234:abcd::1
